        currentClaim:
          allOf:
            - $ref: '#/components/schemas/ParkingClaim'
          nullable: true
        notice:
          allOf:
            - $ref: '#/components/schemas/AvailabilityNotice'
          nullable: true
        unavailableFields:
          type: array
          items:
            type: string
    DashboardEmployee:
      type: object
      required:
        - id
        - name
        - email
        - parkingStatus
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        parkingStatus:
          type: string
          enum:
            - dedicated
            - temporary
    AvailabilityNotice:
      type: object
      required:
        - message
        - email
      properties:
        message:
          type: string
        email:
          type: string
          format: email
    ReleaseRecord:
      type: object
      required:
        - id
        - date
        - status
        - area
        - createdBy
        - createdAt
        - lastChangedBy
        - lastChangedAt
        - claimableAt
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        status:
          type: string
          enum:
            - Reserved
            - Released
            - Claimed
        area:
          type: string
          nullable: true
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        lastChangedBy:
          type: string
        lastChangedAt:
          type: string
          format: date-time
        claimableAt:
          type: string
          format: date-time
    ReleaseList:
      type: object
      required:
        - releases
      properties:
        releases:
          type: array
          items:
            $ref: '#/components/schemas/ReleaseRecord'
    TodayReleaseRequest:
      type: object
      required:
        - officeDate
      properties:
        officeDate:
          type: string
          format: date
    ReleaseScheduleRequest:
      type: object
      required:
        - dates
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
    CancelReleaseRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    ReleaseActionResult:
      type: object
      required:
        - message

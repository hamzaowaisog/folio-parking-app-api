          format: date
        count:
          type: integer
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaCount'
        notYetClaimable:
          type: array
          items:
            $ref: '#/components/schemas/ScheduledArea'
    AreaCount:
      type: object
      required:
        - name
        - count
      properties:
